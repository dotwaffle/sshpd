name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run check
      - name: Check generated SQL sources
        run: |
          mise run generate
          git diff --exit-code -- internal/store/queries
      - name: Build release archives without publication
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: mise exec -- bash scripts/build-release.sh "$RUNNER_TEMP/sshpd-release" snapshot

  native:
    name: Native tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Run native race tests
        run: |
          # Keep test socket paths below the BSD Unix socket path limit.
          test_dir=/tmp/build/sshpd/ci
          mkdir -p "$test_dir"
          chmod 700 "$test_dir"
          trap 'rm -rf "$test_dir"' EXIT
          TMPDIR="$test_dir" go test -race ./... -timeout=20m
      - run: CGO_ENABLED=0 go build -trimpath -buildvcs=false ./...
