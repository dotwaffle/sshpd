min_version = "2026.10.17"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tool_alias]
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"

[tools]
actionlint = "latest"
go = "1.27"
ko = "latest"
golangci-lint = "latest"
govulncheck = "latest"
rumdl = "latest"
sqlc = "latest"

[tasks.format]
description = "Format Go sources and Markdown"
run = ["golangci-lint fmt", "rumdl fmt ."]

[tasks.lint]
description = "Run static analysis"
run = [
  "if [ -d .github/workflows ]; then actionlint; fi",
  "rumdl check .",
  "go vet ./...",
  "golangci-lint run",
]

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks."test:race"]
description = "Run tests with the race detector"
run = "go test -race ./... -timeout=30m"

[tasks."test:release"]
description = "Check release publication guards without network access"
run = "bash scripts/release-state-test.sh"

[tasks."test:compat"]
description = "Check the minimum supported Go release"
tools = { go = "1.26" }
run = ["go test -race ./... -timeout=20m", "CGO_ENABLED=0 go build -trimpath -buildvcs=false ./..."]

[tasks.vulncheck]
description = "Check dependencies for known vulnerabilities"
run = "govulncheck ./..."

[tasks.build]
description = "Build all packages without cgo"
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -buildvcs=false ./..."

[tasks.generate]
description = "Generate Go sources"
run = "go generate ./..."

[tasks.check]
description = "Run tests, static analysis, vulnerability checks, and build"
depends = ["test:race", "test:release", "lint", "vulncheck", "build"]
